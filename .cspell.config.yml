allowCompoundWords: true
dictionaries:
  - cpp
  - en_US
  - en-gb
  - fonts
  - git
  - lorem-ipsum
  - markdown
  - misc
  - npm
  - shell
  - softwareTerms
enableGlobDot: true
features:
  weighted-suggestions: true
globRoot: ${cwd}
ignorePaths:
  - .*ignore
  - .git
  - .github/CODE_OF_CONDUCT.*
  - .vscode/extensions.json
  - cspell.config.yml
  - test
ignoreRegExpList:
