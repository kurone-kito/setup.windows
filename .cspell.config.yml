allowCompoundWords: true
cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
dictionaries:
  - cpp
  - en_US
  - en-gb
  - fonts
  - fullstack
  - git
  - lorem-ipsum
  - markdown
  - misc
  - shellscript
  - softwareTerms
enableGlobDot: true
features:
  weighted-suggestions: true
globRoot: ${cwd}
ignorePaths:
  - .*ignore
  - .git
  - .github/CODE_OF_CONDUCT.*
  - .vscode/extensions.json
  - cspell.config.yml
  - pnpm-lock.yaml
# Winget product ids are opaque uppercase tokens, not prose.
ignoreRegExpList:
  - '\b[0-9A-Z]{12,14}\b'
language: en,ja
useGitignore: true
version: "0.2"
words:
  # Windows setup vocabulary. The v0.14.0 template word list does not
  # include these, and dropping them fails this repository's cspell gate.
  - ajeetdsouza
  - antlr
  - aquaproj
  - bbwe
  - chafa
  - chezmoi
  - choco
  - dbrgn
  - dind
  - dosbox
