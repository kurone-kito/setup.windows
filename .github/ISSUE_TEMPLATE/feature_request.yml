name: ✨ Feature request
description: Suggest an idea for this project
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        Before you continue filling out this report, please take a moment to check that your feature request has not been [already reported on GitHub](https://github.com/kurone-kito/setup.windows/search?q=is%3Aissue&type=issues) 🙌

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve? Why does this matter?
      placeholder: I'm always frustrated when "X" because "Y".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: A clear and concise description of what you'd like to happen.
      placeholder: I would like this project to be able to do "X".
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Detail any potential alternative solutions/workarounds you've used or considered.
      placeholder: I have done/might be able to do "X" in this project by doing "Y".
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - winget configuration (`packages.dsc.yaml`)
        - Chocolatey packages
        - Boxstarter orchestration (`boxstarter.ps1`/`libs/`)
        - post-install scripts
        - documentation
        - CI/tooling
        - other
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: How would you verify this is done?
      description: What would need to be true for this feature request to be considered complete?
    validations:
      required: true
