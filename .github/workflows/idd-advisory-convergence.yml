# Trust model: this workflow is a required-check gate -- its job id is
# registered as a required status check on master's `main` ruleset
# (#61), so tampering matters more here than in an ordinary lint check.
# This file is NOT self-protecting:
# for `pull_request`, GitHub runs the PR's own copy of this workflow
# file (unlike `pull_request_target`, which always resolves from the
# base branch) -- so a PR editing this file does take effect for its own
# run. What IS protected:
#   - `ref: master` on the checkout step means a PR cannot substitute its
#     own edited `.github/idd/config.json` (markerPrefix,
#     trustedMarkerActors, advisoryBotLogins) to weaken the verdict.
#   - Under this repository's `ephemeral-npx` helper-runtime profile
#     (`.github/idd/config.json`'s `helperRuntime.profile`), the actual
#     verdict logic (`advisory-convergence.mjs`) runs straight from the
#     pinned upstream npm tarball below, never from a checked-out copy --
#     there is no in-repository script for a PR to edit.
#   - With this job's id registered as a required status check (#61),
#     deleting/renaming the job or the trigger events in a PR makes the
#     required check simply never report for that PR, rather than
#     report a false "ready" -- required checks fail closed on absence.
#     This does NOT protect against a PR that keeps the job id but
#     weakens its steps to an unconditional success: GitHub only checks
#     that a check-run with this context name reports success, not what
#     the job actually did, so branch protection alone would accept
#     that. Ordinary human/bot review of the diff remains the only
#     defense against that specific weakening, same as before #61.
# If a future change adds a `ref:` override that resolves to the PR head,
# vendors the helper script into this repository, or widens
# `permissions:` below, re-review this trust model before merging that
# change.
name: IDD advisory-convergence gate
# Read-only: contents: read + issues: read + pull-requests: read. The
# helper only queries the GitHub API for reviews, review threads, PR
# conversation comments, and waiver markers; it never mutates GitHub
# state. `issues: read` is required (not just pull-requests: read)
# because the helper reads the PR's own conversation comments via the
# issue-comments REST endpoint, which GitHub gates under the Issues
# permission category even when the issue number is a pull request --
# see post-merge-cleanup.yml, which needs the same permission for the
# identical endpoint shape.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  # Grouped by PR number, not github.ref: pull_request_review is not a
  # pull_request-family event, so github.ref does not resolve the same
  # way for it as it does for lint.yml's pull_request-only trigger.
  # Review-thread comments live in the companion
  # idd-advisory-convergence-comment.yml workflow and must not share
  # this group (#2136, kurone-kito/setup.windows#124).
  # cancel-in-progress stays true deliberately: a narrower group or
  # cancel-in-progress:false both trade this race for an equally-racy
  # alternative rather than closing it (see upstream idd-skill#1381) --
  # if the rollup ever appears stuck on a stale run for the current
  # HEAD SHA, `gh run rerun <run-id>` on the existing pull_request-
  # family run for that SHA is the known recovery.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core
    # on Windows, which would silently misinterpret this file's POSIX
    # command substitution and shell variable expansion (e.g.
    # "$PR_NUMBER") instead of failing loudly. Available on every
    # GitHub-hosted runner, including Windows via Git Bash.
    shell: bash
jobs:
  # The job id doubles as this check's required-status-check context name
  # and as the `ciGate.externalChecks.waivable[].selector` value in
  # `.github/idd/config.json` -- keep both in sync if this id ever
  # changes. Branch-protection registration (#61) is live: this id is
  # registered as a required status check on master's `main` ruleset.
  idd-advisory-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Run advisory-convergence verdict (--assert)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          npx --yes --package https://codeload.github.com/kurone-kito/idd-skill/tar.gz/f51a8bb73a47452eff5799e8a27251b660ba4ae0 \
            idd-advisory-convergence --pr "$PR_NUMBER" --assert
