name: winget CI probe (temporary, issue #69)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Record runner image and date
        shell: pwsh
        run: |
          Write-Output "ImageOS=$env:ImageOS"
          Write-Output "ImageVersion=$env:ImageVersion"
          Write-Output "Date=$(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')"
      - name: Check winget presence
        shell: pwsh
        run: |
          $cmd = Get-Command winget -CommandType Application -ErrorAction SilentlyContinue
          if ($cmd) {
            Write-Output "winget found at: $($cmd.Source)"
          } else {
            Write-Output "winget NOT found on PATH"
          }
      - name: winget --version
        shell: pwsh
        run: |
          winget --version
          Write-Output "exit=$LASTEXITCODE"
      - name: Query winget source (Git.Git, non-interactive)
        shell: pwsh
        run: |
          winget show --exact --id Git.Git --source winget --accept-source-agreements --disable-interactivity
          Write-Output "exit=$LASTEXITCODE"
      - name: Query msstore source (XP9KHM4BK9FZ7Q, non-interactive)
        shell: pwsh
        run: |
          winget show --exact --id XP9KHM4BK9FZ7Q --source msstore --accept-source-agreements --disable-interactivity
          Write-Output "exit=$LASTEXITCODE"
