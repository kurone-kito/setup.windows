name: Linting workflow
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v8
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
  powershell-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser -Repository PSGallery
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -Repository PSGallery
      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests/powershell -CI
  configuration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser -Repository PSGallery
      - name: Regenerate import.json and unapplied-resources list
        shell: pwsh
        run: |
          ./scripts/Build-Configurations.ps1 -DscPath ./configurations/packages.dsc.yaml
          ./scripts/Build-Configurations.ps1 -DscPath ./configurations/packages.min.dsc.yaml
      - name: Fail on drift between dsc.yaml and its generated files
        run: |
          git diff --exit-code -- \
            configurations/packages.import.json \
            configurations/packages.unapplied.json \
            configurations/packages.min.import.json \
            configurations/packages.min.unapplied.json
