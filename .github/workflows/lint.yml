name: Linting workflow
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v8
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
  powershell-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -Repository PSGallery
      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests/powershell -CI
